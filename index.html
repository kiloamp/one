<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>EASA FSTD Framework Briefing</title>
    <meta
      name="description"
      content="Static Reveal.js briefing on EASA Regulation (EU) 2026/781, FSTD Capability Signatures, task-to-tool, and ATO implementation."
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css"
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css"
    >
    <style> 
      .reveal .slides h1, 
      .reveal .slides h2,
      .reveal .slides h4, 
      .reveal .slides h3 { 
        text-transform: none; 
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="slides.md"
          data-separator="^---$"
          data-separator-vertical="^--$"
          data-separator-notes="^Note:"
        ></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
    <script>
      Reveal.initialize({
        hash: true,
        controls: true,
        progress: true,
        transition: "slide",
        maxScale: 1.0,
        plugins: [
          RevealMarkdown,
          RevealNotes,
          RevealHighlight
        ]
      });
    </script>
  </body>
</html>
